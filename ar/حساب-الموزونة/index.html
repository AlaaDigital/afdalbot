        .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

        .share-btn.primary{background:var(--brass);border-color:var(--brass);color:#fff;}

        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--indigo);color:#fff;padding:.7rem 1.1rem;border-radius:999px;font-size:.88rem;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:9999;}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1.75rem; position:relative;}
        .card::before{content:""; position:absolute; inset:6px; border:1px solid var(--line); border-radius:9px; pointer-events:none; opacity:.6;}

        .tabs{display:flex; gap:.5rem; margin-bottom:1.5rem;}
        .tab{flex:1; padding:.7rem; text-align:center; border-radius:9px; cursor:pointer; font-weight:700; font-size:.92rem; border:1px solid var(--line); color:var(--muted); background:transparent; font-family:'Cairo','Cairo Fallback',sans-serif; min-height:44px; line-height:1.3;}
        .tab.active{background:var(--indigo); color:var(--paper); border-color:var(--indigo);}
        .tab:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
        .panel{display:none;}
        .panel.active{display:block;}
        .row{display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:.6rem; margin-bottom:1.1rem;}
        .row.two-cols{grid-template-columns:1fr 1fr;}
        .field{display:flex; flex-direction:column; gap:.35rem;}
        .field label{font-size:.82rem; font-weight:700; color:var(--muted);}
        select{width:100%; padding:.65rem .5rem; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:'Cairo','Cairo Fallback',inherit; font-size:.95rem; font-variant-numeric:tabular-nums; min-height:44px; appearance:auto;}
        select:focus{outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass);}
        button.convert{width:100%; padding:.85rem; border:none; border-radius:9px; cursor:pointer; background:var(--brass); color:#241f16; font-family:'Cairo','Cairo Fallback',inherit; font-weight:700; font-size:1rem; min-height:44px; transition:.15s;}
        button.convert:hover{background:var(--brass-dark); color:#fff;}

        .results{margin-top:1.5rem; display:none;}

        .age-box{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:1rem; text-align:center;}
        .age-box .cal{font-size:.8rem; color:var(--muted); font-weight:700; margin-bottom:.4rem;}
        .age-box .big{font-size:1.5rem; font-weight:900; font-variant-numeric:tabular-nums; color:var(--indigo);}
        .age-box .unit{font-size:.78rem; color:var(--muted); margin-top:.2rem;}

        .stats{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
        .stats > div{background:var(--panel); padding:.8rem .9rem;}
        .stats .lbl{font-size:.78rem; color:var(--muted); margin-bottom:.2rem;}
        .stats .val{font-weight:700; font-variant-numeric:tabular-nums; font-size:.95rem; line-height:1.5;}
        .stats .full{grid-column:1 / -1;}
