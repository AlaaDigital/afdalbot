<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحويل التاريخ الهجري إلى الميلادي والعكس</title>
<!-- أسرع حل: preload للخط المحلي + خط مضمن بدون ملف fonts.css خارجي -->
<link rel="preload" href="fonts/cairo-v31-arabic_latin-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cairo-v31-arabic_latin-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* الخط موجود في المشروع نفسه - أسرع تحميل - بدون طلب خارجي */
@font-face{font-family:'Cairo';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/cairo-v31-arabic_latin-regular.woff2') format('woff2');}
@font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/cairo-v31-arabic_latin-700.woff2') format('woff2');}
@font-face{font-family:'Cairo';font-style:normal;font-weight:900;font-display:swap;src:url('fonts/cairo-v31-arabic_latin-900.woff2') format('woff2');}
:root{--ink:#241f16;--paper:#faf7f0;--panel:#fffdf8;--brass:#8a6526;--brass-dark:#6d4e1b;--indigo:#1b2540;--line:#e4dcc8;--muted:#5a5444;}
*{box-sizing:border-box;}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Cairo',-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.wrap{max-width:720px;margin:0 auto;padding:2.5rem 1.25rem 4rem;}header{text-align:center;margin-bottom:1.2rem;}.kicker{color:var(--brass-dark);font-weight:700;font-size:.95rem;}h1{font-size:2rem;font-weight:900;margin:.35rem 0 .5rem;line-height:1.4;}header p{color:var(--muted);font-size:1.02rem;margin:0 auto;max-width:52ch;}
.share-bar{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:1.25rem 0 1.9rem;}.share-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem .95rem;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:.88rem;cursor:pointer;font-family:'Cairo',sans-serif;min-height:44px;}.share-btn.primary{background:var(--brass);border-color:var(--brass);color:#fff;}
.today-strip{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:1.75rem 0 2.25rem;}.today-strip>div{flex:1;background:var(--panel);padding:.85rem 1rem;text-align:center;}.today-strip .lbl{font-size:.78rem;color:var(--muted);}.today-strip .val{font-weight:700;font-size:.98rem;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.75rem;}.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;}.tab{flex:1;padding:.7rem;text-align:center;border-radius:9px;cursor:pointer;font-weight:700;font-size:.92rem;border:1px solid var(--line);color:var(--muted);background:transparent;font-family:'Cairo',sans-serif;min-height:44px;}.tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
.panel{display:none;}.panel.active{display:block;}.row{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:.6rem;margin-bottom:1.1rem;}select{width:100%;padding:.65rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:'Cairo',inherit;font-size:.95rem;min-height:44px;}button.convert{width:100%;padding:.85rem;border:none;border-radius:9px;cursor:pointer;background:var(--brass);color:#fff;font-family:'Cairo',inherit;font-weight:700;font-size:1rem;min-height:44px;}
.result{margin-top:1.25rem;padding:1.1rem;border-radius:10px;background:var(--paper);border:1px dashed var(--line);text-align:center;display:none;}.result.show{display:block;}.result .big{font-size:1.35rem;font-weight:900;}
</style>
</head>
<body>
<main class="wrap">
<header><div class="kicker">أداة مجانية</div><h1>تحويل التاريخ الهجري إلى الميلادي والعكس</h1><p>حوّل أي تاريخ بين التقويمين الهجري والميلادي بضغطة واحدة.</p></header>
<nav class="share-bar"><button type="button" class="share-btn primary" onclick="copyArabicLink()">🔗 نسخ الرابط العربي</button><button type="button" class="share-btn" onclick="shareWhatsApp()">واتساب</button><button type="button" class="share-btn" onclick="shareFacebook()">فيسبوك</button><button type="button" class="share-btn" onclick="shareTelegram()">تيليجرام</button></nav>
<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1b2540;color:#fff;padding:.7rem 1.1rem;border-radius:999px;font-size:.88rem;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:9999">تم</div>
<section class="today-strip" id="todayStrip"></section>
<section class="card"><div class="tabs" role="tablist"><button type="button" class="tab active" role="tab" aria-selected="true" data-tab="h2g">هجري إلى ميلادي</button><button type="button" class="tab" role="tab" aria-selected="false" data-tab="g2h">ميلادي إلى هجري</button></div>
<div class="panel active" id="panel-h2g"><div class="row"><select id="h_day" aria-label="اليوم الهجري"></select><select id="h_month" aria-label="الشهر الهجري"></select><select id="h_year" aria-label="السنة الهجرية"></select></div><button type="button" class="convert" onclick="convertH2G()">حوّل التاريخ</button><div class="result" id="result-h2g"><div class="big" id="result-h2g-text"></div></div></div>
<div class="panel" id="panel-g2h" hidden><div class="row"><select id="g_day" aria-label="اليوم الميلادي"></select><select id="g_month" aria-label="الشهر الميلادي"></select><select id="g_year" aria-label="السنة الميلادية"></select></div><button type="button" class="convert" onclick="convertG2H()">حوّل التاريخ</button><div class="result" id="result-g2h"><div class="big" id="result-g2h-text"></div></div></div>
</section>
</main>
<script>
function getArabicUrl(){try{return decodeURI(window.location.href);}catch(e){return window.location.href;}}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';},2200);}
function copyArabicLink(){navigator.clipboard.writeText(getArabicUrl()).then(()=>showToast('تم نسخ الرابط بالعربي ✅'));}
function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(getArabicUrl()),'_blank');}
function shareFacebook(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(window.location.href),'_blank');}
function shareTelegram(){window.open('https://t.me/share/url?url='+encodeURIComponent(window.location.href),'_blank');}
function gregorianToJDN(y,m,d){const a=Math.floor((14-m)/12);const y2=y+4800-a;const m2=m+12*a-3;return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;}
function jdnToGregorian(jdn){const a=jdn+32044;const b=Math.floor((4*a+3)/146097);const c=a-Math.floor((146097*b)/4);const d=Math.floor((4*c+3)/1461);const e=c-Math.floor((1461*d)/4);const m=Math.floor((5*e+2)/153);const day=e-Math.floor((153*m+2)/5)+1;const month=m+3-12*Math.floor(m/10);const year=100*b+d-4800+Math.floor(m/10);return{year,month,day};}
function jdnToHijri(jdn){let l=jdn-1948440+10632;const n=Math.floor((l-1)/10631);l=l-10631*n+354;const j=(Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719))+(Math.floor(l/5670))*(Math.floor((43*l)/15238));l=l-(Math.floor((30-j)/15))*(Math.floor((17719*j)/50))-(Math.floor(j/16))*(Math.floor((15238*j)/43))+29;const hm=Math.floor((24*l)/709);const hd=l-Math.floor((709*hm)/24);const hy=30*n+j-30;return{year:hy,month:hm,day:hd};}
function hijriToJDN(hy,hm,hd){return Math.floor((11*hy+3)/30)+354*hy+30*hm-Math.floor((hm-1)/2)+hd+1948440-385;}
const hijriMonths=["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];const gregMonths=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function fillSelect(el,c,s,l){el.innerHTML="";for(let i=0;i<c;i++){const o=document.createElement("option");const v=s+i;o.value=v;o.textContent=l?l[i]:v;el.appendChild(o);}}
function initSelectors(){const todayJDN=gregorianToJDN(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());const todayH=jdnToHijri(todayJDN);const todayG={year:new Date().getFullYear(),month:new Date().getMonth()+1,day:new Date().getDate()};fillSelect(document.getElementById('h_day'),30,1);fillSelect(document.getElementById('h_month'),12,1,hijriMonths);fillSelect(document.getElementById('h_year'),120,1390);document.getElementById('h_day').value=todayH.day;document.getElementById('h_month').value=todayH.month;document.getElementById('h_year').value=todayH.year;fillSelect(document.getElementById('g_day'),31,1);fillSelect(document.getElementById('g_month'),12,1,gregMonths);fillSelect(document.getElementById('g_year'),150,1950);document.getElementById('g_day').value=todayG.day;document.getElementById('g_month').value=todayG.month;document.getElementById('g_year').value=todayG.year;document.getElementById('todayStrip').innerHTML=`<div><div class="lbl">اليوم ميلاديًا</div><div class="val">${todayG.day} ${gregMonths[todayG.month-1]} ${todayG.year}</div></div><div><div class="lbl">اليوم هجريًا</div><div class="val">${todayH.day} ${hijriMonths[todayH.month-1]} ${todayH.year}هـ</div></div>`;}
function convertH2G(){const d=+document.getElementById('h_day').value;const m=+document.getElementById('h_month').value;const y=+document.getElementById('h_year').value;const jdn=hijriToJDN(y,m,d);const g=jdnToGregorian(jdn);document.getElementById('result-h2g-text').textContent=`${g.day} ${gregMonths[g.month-1]} ${g.year}م`;document.getElementById('result-h2g').classList.add('show');}
function convertG2H(){const d=+document.getElementById('g_day').value;const m=+document.getElementById('g_month').value;const y=+document.getElementById('g_year').value;const jdn=gregorianToJDN(y,m,d);const h=jdnToHijri(jdn);document.getElementById('result-g2h-text').textContent=`${h.day} ${hijriMonths[h.month-1]} ${h.year}هـ`;document.getElementById('result-g2h').classList.add('show');}
document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');});document.querySelectorAll('.panel').forEach(p=>{p.classList.remove('active');p.hidden=true;});tab.classList.add('active');document.getElementById('panel-'+tab.dataset.tab).classList.add('active');document.getElementById('panel-'+tab.dataset.tab).hidden=false;});});
initSelectors();
</script>
</body>
</html>
